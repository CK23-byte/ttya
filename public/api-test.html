<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Connection Test - ttya</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
      text-align: center;
    }

    .header h1 {
      color: #333;
      margin-bottom: 10px;
    }

    .header p {
      color: #666;
      font-size: 14px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .summary-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .summary-card h3 {
      font-size: 36px;
      margin-bottom: 5px;
    }

    .summary-card p {
      color: #666;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .summary-card.success h3 { color: #10b981; }
    .summary-card.failure h3 { color: #ef4444; }
    .summary-card.skipped h3 { color: #f59e0b; }
    .summary-card.total h3 { color: #667eea; }

    .results {
      display: grid;
      gap: 20px;
    }

    .result-card {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      border-left: 5px solid #ccc;
    }

    .result-card.success { border-left-color: #10b981; }
    .result-card.failure { border-left-color: #ef4444; }
    .result-card.skipped { border-left-color: #f59e0b; }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .result-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-icon {
      font-size: 24px;
    }

    .service-name {
      font-size: 20px;
      font-weight: 600;
      color: #333;
    }

    .duration {
      background: #f3f4f6;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 12px;
      color: #666;
    }

    .result-message {
      color: #666;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .result-details {
      background: #f9fafb;
      padding: 15px;
      border-radius: 5px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      overflow-x: auto;
    }

    .result-details pre {
      margin: 0;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #f3f4f6;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .warnings {
      background: #fffbeb;
      border: 1px solid #fde68a;
      color: #92400e;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .warnings h3 {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .warnings ul {
      margin-left: 20px;
    }

    .warnings li {
      margin-bottom: 5px;
    }

    .refresh-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 20px;
    }

    .refresh-btn:hover {
      background: #5568d3;
    }

    .timestamp {
      text-align: center;
      color: white;
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔌 API Connection Test</h1>
      <p>Testing all external API integrations</p>
    </div>

    <div id="content">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>Running API tests...</p>
      </div>
    </div>

    <div class="timestamp" id="timestamp"></div>
  </div>

  <script>
    async function runTests() {
      const contentDiv = document.getElementById('content');
      const timestampDiv = document.getElementById('timestamp');

      try {
        const response = await fetch('/api/test-apis');
        const data = await response.json();

        // Display warnings if any
        let html = '';
        if (data.warnings && data.warnings.length > 0) {
          html += `
            <div class="warnings">
              <h3>⚠️ Missing API Keys</h3>
              <ul>
                ${data.warnings.map(w => `<li>${w}</li>`).join('')}
              </ul>
              <p style="margin-top: 10px; font-size: 12px;">
                Configure these in Vercel Settings → Environment Variables
              </p>
            </div>
          `;
        }

        // Display summary
        html += `
          <div class="summary">
            <div class="summary-card total">
              <h3>${data.summary.total}</h3>
              <p>Total</p>
            </div>
            <div class="summary-card success">
              <h3>${data.summary.passed}</h3>
              <p>Passed</p>
            </div>
            <div class="summary-card failure">
              <h3>${data.summary.failed}</h3>
              <p>Failed</p>
            </div>
            <div class="summary-card skipped">
              <h3>${data.summary.skipped}</h3>
              <p>Skipped</p>
            </div>
          </div>
        `;

        // Display results
        html += '<div class="results">';
        data.results.forEach(result => {
          const icon = result.status === 'success' ? '✅' :
                      result.status === 'failure' ? '❌' : '⏭️';

          const durationText = result.duration ? `${result.duration}ms` : 'N/A';

          html += `
            <div class="result-card ${result.status}">
              <div class="result-header">
                <div class="result-title">
                  <span class="status-icon">${icon}</span>
                  <span class="service-name">${result.service}</span>
                </div>
                <span class="duration">${durationText}</span>
              </div>
              <div class="result-message">${result.message}</div>
              ${result.details ? `
                <div class="result-details">
                  <pre>${JSON.stringify(result.details, null, 2)}</pre>
                </div>
              ` : ''}
            </div>
          `;
        });
        html += '</div>';

        // Add refresh button
        html += `
          <div style="text-align: center;">
            <button class="refresh-btn" onclick="location.reload()">
              🔄 Refresh Tests
            </button>
          </div>
        `;

        contentDiv.innerHTML = html;
        timestampDiv.textContent = `Last tested: ${new Date(data.timestamp).toLocaleString()}`;

      } catch (error) {
        contentDiv.innerHTML = `
          <div class="error">
            <h3>❌ Error Running Tests</h3>
            <p>${error.message}</p>
            <button class="refresh-btn" onclick="location.reload()">
              🔄 Try Again
            </button>
          </div>
        `;
        console.error('Test error:', error);
      }
    }

    // Run tests on page load
    runTests();
  </script>
</body>
</html>
